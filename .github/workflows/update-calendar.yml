name: update-calendar

on:
  schedule:
    # 每天凌晨运行一次（UTC 6:17）。
    # 夏令时QC 2:17，冬令时 1:17。
    - cron: "17 6 * * *"
  # 允许在 Actions 页面手动运行
  workflow_dispatch:
  # 改了网页或生成脚本后，自动重新发布
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 本仓库：网页和生成脚本
      - uses: actions/checkout@v7

      # 原仓库：读取日历程序
      - uses: actions/checkout@v7
        with:
          repository: XiyueZ1/UL-PEPS-piscine-calendar
          path: tool

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r tool/requirements.txt

      # 只下载一次网页
      - name: Download schedule page
        run: |
          curl -sSLf --retry 3 --max-time 60 -A "Mozilla/5.0" \
            "https://peps.ulaval.ca/activite/bains-libres" -o page.html

      # 如果官网改版导致失败，网上的日历保持上一个版本不变
      - name: Build calendars
        run: |
          bash build.sh tool/peps_piscine.py page.html public
          cp site/index.html public/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
